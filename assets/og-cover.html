<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/manrope.css"><style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b1420;color:#f4f2ec;font-family:Manrope,Arial,sans-serif}.card{position:relative;width:100%;height:100%;display:grid;grid-template-columns:1.18fr .82fr}.copy{padding:92px 40px 74px 84px;display:flex;flex-direction:column;justify-content:center}.small{font-size:17px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#f5793b;margin-bottom:28px}h1{font-size:68px;line-height:1;letter-spacing:-.055em;margin:0;max-width:690px}h1 span{display:block;color:#f5793b}.sub{font-size:22px;color:#a9b4c0;margin-top:28px}.photo{position:relative;overflow:hidden}.photo:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#0b1420 0%,rgba(11,20,32,.68) 22%,rgba(11,20,32,0) 55%)}.photo img{width:100%;height:100%;object-fit:cover;object-position:52% 24%}.name{position:absolute;left:84px;bottom:48px;font-size:16px;font-weight:700}</style></head><body><main class="card"><section class="copy"><div class="small">Сайты / Avito / VK / реклама</div><h1>Упаковываю бизнес <span>в интернете</span></h1><p class="sub">Работаю лично, без агентства.</p></section><div class="photo"><img src="images/mikhail-portrait.jpg" alt=""></div><div class="name">Михаил Косорубов</div></main></body></html>
