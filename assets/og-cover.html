<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="fonts/manrope.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#101318;color:#f1f2ee;font-family:Manrope,Arial,sans-serif}
    .card{position:relative;width:100%;height:100%;display:grid;grid-template-columns:1.22fr .78fr}
    .copy{padding:72px 40px 72px 76px;display:flex;flex-direction:column;justify-content:center}
    .brand{position:absolute;left:76px;top:50px;font-size:25px;font-weight:800;letter-spacing:-.05em}
    .brand span,.small,h1 span{color:#e66f3e}
    .small{margin-bottom:24px;font-size:15px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    h1{max-width:700px;margin:0;font-size:70px;line-height:.98;letter-spacing:-.06em}
    h1 span{display:block}
    .sub{margin:26px 0 0;color:#a7adb6;font-size:21px}
    .photo{position:relative;margin:54px 56px 54px 0}
    .photo::before{content:"";position:absolute;right:-18px;bottom:-18px;width:65%;height:64%;border-radius:16px;background:#e66f3e}
    .photo img{position:relative;width:100%;height:100%;object-fit:cover;object-position:52% 24%;border-radius:16px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Михаил<span>.</span></div>
    <section class="copy">
      <div class="small">Digital для малого бизнеса</div>
      <h1>Бизнес выглядит <span>убедительно.</span></h1>
      <p class="sub">Сайты, Avito, VK и реклама.</p>
    </section>
    <div class="photo"><img src="images/mikhail-portrait.jpg" alt=""></div>
  </main>
</body>
</html>
